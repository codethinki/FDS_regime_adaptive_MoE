[project]
name = "regime-adaptive-moe"
version = "0.1.0"
description = "Regime-adaptive mixture of experts for portfolio allocation with RL"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "yfinance",
    "jumpmodels",
    "hmmlearn",
    "scikit-learn",
    "torch",
    "ipykernel",
    "nbformat",
    "nbconvert",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_moe"]

# CPU-only torch on Linux (small MLPs, avoids the multi-GB CUDA build)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
