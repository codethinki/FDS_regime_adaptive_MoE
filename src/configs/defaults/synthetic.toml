# toy regime market (from the big MoE demo); used when data.source = "synthetic"
n_days = 5000
seeds = [42]                     # market paths; seed 42 reproduces the demo's market exactly
train_fraction = 0.7             # of the market periods; rest is validation
noise_feature = false            # demo: one extra pure-noise "volume" feature (lognormal)

# regime Markov chain, rows = from, cols = to
transition = [
    [0.96, 0.03, 0.01],
    [0.03, 0.94, 0.03],
    [0.02, 0.04, 0.94],
]

# daily mean return per regime (rows) and asset (cols)
means = [
    [0.0010, 0.0005, 0.0002, 0.0007],
    [-0.0010, -0.0003, 0.0002, -0.0007],
    [0.0002, 0.0010, 0.0007, 0.0001],
]

# daily volatility per regime (same for all assets)
vols = [0.008, 0.018, 0.011]
